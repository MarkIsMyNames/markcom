name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # markcom, the Python start-up library.
  markcom:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: markcom
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Qt's system libraries (the tray tests draw off screen)
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Install dependencies (including dev and test)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Strict type check
        run: uv run mypy src
      - name: Language security scanner
        run: uv run bandit -q -r src -x '*_test.py'
      - name: Dependency audit
        run: uv run pip-audit --skip-editable
      - name: Tests with coverage gate
        run: uv run pytest -q

  # markcom's Linux notifications sent over a real D-Bus session, to a fake notification
  # service the tests run. A job of its own, so the unit tests stay fast.
  markcom-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: markcom
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dbus-run-session
        run: sudo apt-get update && sudo apt-get install --yes dbus-daemon
      - name: Install dependencies (including dev and test)
        run: uv sync --locked
      # A private session bus, so the fake service can own org.freedesktop.Notifications.
      - name: Integration tests
        run: dbus-run-session -- uv run pytest tests/integration --no-cov -q

  # On every push to main (a merged PR included), releases markcom as the tag
  # markcom-v<version>, the tag projects install it by and Renovate watches. A version raised
  # by hand in pyproject.toml is released as it is; otherwise, when the library's source or
  # pyproject.toml changed since the last release, the next patch version is released. The tag
  # points at a release commit, made on top of the pushed commit, whose pyproject.toml carries
  # the released version; sync-versions then commits that version to main.
  release-markcom:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [markcom, markcom-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The latest version, released now or before, for sync-versions.
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Every commit and tag, to compare against the last release.
          fetch-depth: 0
      - name: Tag the release
        id: tag
        run: |
          declared=$(python3 -c 'import tomllib; print(tomllib.load(open("markcom/pyproject.toml", "rb"))["project"]["version"])')
          latest_tag=$(git tag --list 'markcom-v*' --sort=-version:refname | head -n 1)
          latest=${latest_tag#markcom-v}
          if [ "$declared" != "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$declared" | sort -V | tail -n 1)" = "$declared" ]; then
            version=$declared
            echo "Releasing ${version}, raised by hand from ${latest}"
          else
            # A release commit's parent is the main commit it was made from, so this compares
            # main then with main now. Tests are left out: they ship in no release. So is the
            # version line, which sync-versions changes on main after each release.
            if git diff --quiet -I '^version = ' "${latest_tag}^" HEAD -- markcom/src markcom/pyproject.toml ':(exclude)markcom/src/**/*_test.py'; then
              echo "markcom is unchanged since ${latest}; nothing to release"
              echo "version=${latest}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            IFS=. read -r major minor patch <<< "$latest"
            version="${major}.${minor}.$((patch + 1))"
            echo "Releasing ${version}, changed since ${latest}"
          fi
          sed -i "s/^version = \"${declared}\"$/version = \"${version}\"/" markcom/pyproject.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore(markcom): release ${version}" -- markcom/pyproject.toml
          git tag -a "markcom-v${version}" -m "markcom ${version}"
          git push origin "markcom-v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  # The TypeScript libraries the react-ui websites install from npm. web-config is built
  # first because markcom-i18n lints itself with it.
  web-libraries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        library: [markcom-web-config, markcom-i18n]
    defaults:
      run:
        working-directory: ${{ matrix.library }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: "*/package-lock.json"
      - name: Build markcom-web-config, which markcom-i18n lints with
        if: matrix.library == 'markcom-i18n'
        working-directory: markcom-web-config
        run: npm ci && npm run build
      - name: Install dependencies (including dev and test)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Strict type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm run audit
      # web-config has no unit tests: linting markcom-i18n and the react-ui template with it
      # is its test.
      - name: Tests with coverage gate
        if: matrix.library == 'markcom-i18n'
        run: npm test
      - name: Install Chromium for the end-to-end tests
        if: matrix.library == 'markcom-i18n'
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (language routing on the test site in e2e/site)
        if: matrix.library == 'markcom-i18n'
        run: npm run test:e2e

  # On every push to main (a merged PR included), publishes each web library that changed.
  # A version raised by hand in package.json (a minor or major release) is published as it is;
  # otherwise, when the built package differs from the latest on npm, the next patch version
  # is published. sync-versions then commits the version to main. It signs in to npm by
  # trusted publishing, set up on each package's npm settings page for this repository and
  # ci.yml.
  publish-web-libraries:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web-libraries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Each library's latest version, published now or before, for sync-versions.
    outputs:
      markcom-web-config: ${{ steps.release.outputs.markcom-web-config }}
      markcom-i18n: ${{ steps.release.outputs.markcom-i18n }}
    strategy:
      # One library failing to publish must not stop the other.
      fail-fast: false
      matrix:
        library: [markcom-web-config, markcom-i18n]
    defaults:
      run:
        working-directory: ${{ matrix.library }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      # markcom-i18n's tsconfig extends markcom-web-config's, which needs its own dependencies.
      - name: Install markcom-web-config's dependencies
        if: matrix.library == 'markcom-i18n'
        working-directory: markcom-web-config
        run: npm ci
      - name: Build
        run: npm ci && npm run build
      # No installer reads these, and Renovate bumps them on most merges; packed, they would
      # make an unchanged library look changed.
      - name: Drop development-only fields from package.json
        run: npm pkg delete devDependencies overrides scripts
      - name: Choose the version to publish
        id: release
        env:
          LIBRARY: ${{ matrix.library }}
        run: |
          name=$(node -p "require('./package.json').name")
          declared=$(node -p "require('./package.json').version")
          latest=$(npm view "$name" version)
          # Prints true when the first version is higher than the second.
          is_higher='const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number));
            const i = a.findIndex((part, n) => part !== b[n]);
            console.log(i !== -1 && a[i] > b[i]);'
          if [ "$(node -e "$is_higher" "$declared" "$latest")" = "true" ]; then
            echo "Publishing ${name} ${declared}, raised by hand from ${latest}"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "${LIBRARY}=${declared}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm version "$latest" --no-git-tag-version --allow-same-version > /dev/null
          built=$(npm pack --dry-run --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].shasum')
          if [ "$built" = "$(npm view "${name}@${latest}" dist.shasum)" ]; then
            echo "${name} is unchanged since ${latest}; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${LIBRARY}=${latest}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm version patch --no-git-tag-version > /dev/null
          version=$(node -p "require('./package.json').version")
          echo "Publishing ${name} ${version}, changed since ${latest}"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "${LIBRARY}=${version}" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.release.outputs.publish == 'true'
        # npm trusted publishing: npm signs in with this run's OIDC token (id-token: write),
        # so no npm token is stored anywhere.
        run: npm publish --access public --provenance

  # After the releases, commits the released versions to main, so markcom's pyproject.toml and
  # uv.lock and each library's package.json name the latest release. It never lowers a
  # version: main may already carry a higher one raised by hand. A push with GITHUB_TOKEN
  # starts no workflow run, so this commit releases nothing.
  sync-versions:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [release-markcom, publish-web-libraries]
    runs-on: ubuntu-latest
    # Runs for pushes close together take turns, so each commits on top of the last.
    concurrency:
      group: sync-versions
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # main as it is now: another push may have landed since this run started.
          ref: main
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Commit the released versions to main
        env:
          MARKCOM: ${{ needs.release-markcom.outputs.version }}
          WEB_CONFIG: ${{ needs.publish-web-libraries.outputs.markcom-web-config }}
          I18N: ${{ needs.publish-web-libraries.outputs.markcom-i18n }}
        run: |
          # True when the second version is higher than the first.
          is_raise() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$2" ]; }
          declared=$(python3 -c 'import tomllib; print(tomllib.load(open("markcom/pyproject.toml", "rb"))["project"]["version"])')
          if is_raise "$declared" "$MARKCOM"; then
            sed -i "s/^version = \"${declared}\"$/version = \"${MARKCOM}\"/" markcom/pyproject.toml
            # sed succeeds when nothing matches; fail rather than leave the old version
            grep -qx "version = \"${MARKCOM}\"" markcom/pyproject.toml
            uv lock --directory markcom
          fi
          # npm version writes package.json and package-lock.json.
          sync_library() {
            declared=$(node -p "require('./$1/package.json').version")
            if is_raise "$declared" "$2"; then
              (cd "$1" && npm version "$2" --no-git-tag-version > /dev/null)
            fi
          }
          sync_library markcom-web-config "$WEB_CONFIG"
          sync_library markcom-i18n "$I18N"
          if git diff --quiet; then
            echo "main already carries the released versions"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync versions with the latest releases"
          git push origin HEAD:main

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: read
