name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # markcom, the Python start-up library.
  markcom:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: markcom
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Qt's system libraries (the tray tests draw off screen)
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Install dependencies (including dev and test)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Strict type check
        run: uv run mypy src
      - name: Language security scanner
        run: uv run bandit -q -r src -x '*_test.py'
      - name: Dependency audit
        run: uv run pip-audit --skip-editable
      - name: Tests with coverage gate
        run: uv run pytest -q

  # markcom's Linux notifications sent over a real D-Bus session, to a fake notification
  # service the tests run. A job of its own, so the unit tests stay fast.
  markcom-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: markcom
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dbus-run-session
        run: sudo apt-get update && sudo apt-get install --yes dbus-daemon
      - name: Install dependencies (including dev and test)
        run: uv sync --locked
      # A private session bus, so the fake service can own org.freedesktop.Notifications.
      - name: Integration tests
        run: dbus-run-session -- uv run pytest tests/integration --no-cov -q

  # On every push to main (a merged PR included), releases markcom as the tag
  # markcom-v<version>, the tag projects install it by and Renovate watches. It tags the pushed
  # commit when the version in pyproject.toml is higher than the last tag; version-raised makes
  # sure every PR that changes what ships raises it.
  release-markcom:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [markcom, markcom-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Every tag, to find the last release.
          fetch-depth: 0
      - name: Tag the release
        run: |
          declared=$(python3 -c 'import tomllib; print(tomllib.load(open("markcom/pyproject.toml", "rb"))["project"]["version"])')
          latest_tag=$(git tag --list 'markcom-v*' --sort=-version:refname | head -n 1)
          latest=${latest_tag#markcom-v}
          if [ "$declared" = "$latest" ]; then
            echo "markcom ${declared} is already released; nothing to release"
            exit 0
          fi
          if [ "$(printf '%s\n%s\n' "$latest" "$declared" | sort -V | tail -n 1)" != "$declared" ]; then
            echo "::error::markcom ${declared} in pyproject.toml is lower than the last release, ${latest}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "markcom-v${declared}" -m "markcom ${declared}"
          git push origin "markcom-v${declared}"
          echo "Released markcom ${declared}"

  # The TypeScript libraries the react-ui websites install from npm. web-config is built
  # first because markcom-i18n lints itself with it.
  web-libraries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        library: [markcom-web-config, markcom-i18n]
    defaults:
      run:
        working-directory: ${{ matrix.library }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: "*/package-lock.json"
      - name: Build markcom-web-config, which markcom-i18n lints with
        if: matrix.library == 'markcom-i18n'
        working-directory: markcom-web-config
        run: npm ci && npm run build
      - name: Install dependencies (including dev and test)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Strict type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm run audit
      # web-config has no unit tests: linting markcom-i18n and the react-ui template with it
      # is its test.
      - name: Tests with coverage gate
        if: matrix.library == 'markcom-i18n'
        run: npm test
      - name: Install Chromium for the end-to-end tests
        if: matrix.library == 'markcom-i18n'
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (language routing on the test site in e2e/site)
        if: matrix.library == 'markcom-i18n'
        run: npm run test:e2e

  # On every push to main (a merged PR included), publishes each web library whose version in
  # package.json is higher than the latest on npm; version-raised makes sure every PR that
  # changes what ships raises it. It signs in to npm by trusted publishing, set up on each
  # package's npm settings page for this repository and ci.yml.
  publish-web-libraries:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web-libraries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      # One library failing to publish must not stop the other.
      fail-fast: false
      matrix:
        library: [markcom-web-config, markcom-i18n]
    defaults:
      run:
        working-directory: ${{ matrix.library }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      # markcom-i18n's tsconfig extends markcom-web-config's, which needs its own dependencies.
      - name: Install markcom-web-config's dependencies
        if: matrix.library == 'markcom-i18n'
        working-directory: markcom-web-config
        run: npm ci
      - name: Build
        run: npm ci && npm run build
      - name: Choose whether to publish
        id: release
        run: |
          name=$(node -p "require('./package.json').name")
          declared=$(node -p "require('./package.json').version")
          latest=$(npm view "$name" version)
          if [ "$declared" = "$latest" ]; then
            echo "${name} ${declared} is already published; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Prints true when the first version is higher than the second.
          is_higher='const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number));
            const i = a.findIndex((part, n) => part !== b[n]);
            console.log(i !== -1 && a[i] > b[i]);'
          if [ "$(node -e "$is_higher" "$declared" "$latest")" != "true" ]; then
            echo "::error::${name} ${declared} in package.json is lower than the latest on npm, ${latest}"
            exit 1
          fi
          echo "Publishing ${name} ${declared}"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.release.outputs.publish == 'true'
        # npm trusted publishing: npm signs in with this run's OIDC token (id-token: write),
        # so no npm token is stored anywhere.
        run: npm publish --access public --provenance

  # On every pull request, fails when a library's shipped files changed but its version was not
  # raised, so every release is a version committed to the repository. Tests, lock files,
  # devDependencies, overrides, dependency-groups and tool settings ship in no release.
  version-raised:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The PR's merge commit and its first parent, main as it is now.
          fetch-depth: 2
      - name: Require a raised version for every library whose shipped files changed
        run: |
          # The parts of pyproject.toml an install reads, without the version.
          python_manifest() {
            git show "$1:markcom/pyproject.toml" | python3 -c '
          import json, sys, tomllib
          manifest = tomllib.load(sys.stdin.buffer)
          del manifest["project"]["version"]
          print(json.dumps([manifest["project"], manifest["build-system"], manifest["tool"]["hatch"]], sort_keys=True))'
          }
          # The parts of package.json an install reads, without the version; the kept scripts
          # make the tarball. Keys sorted, as npm install re-sorts dependencies.
          npm_manifest() { git show "$1:$2/package.json" | jq -S 'del(.version, .devDependencies, .overrides) | .scripts |= {build, prepare, prepack, prepublishOnly}'; }
          python_version() { git show "$1:markcom/pyproject.toml" | python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])'; }
          npm_version() { git show "$1:$2/package.json" | jq -r .version; }
          # Usage: require_raise <library> <version on main> <version in the PR> <manifest on main> <manifest in the PR> <shipped paths...>
          require_raise() {
            library=$1 before=$2 after=$3 manifest_before=$4 manifest_after=$5
            shift 5
            # A failed read in a command substitution doesn't stop the script, so check here.
            if [ -z "$before" ] || [ -z "$after" ] || [ -z "$manifest_before" ] || [ -z "$manifest_after" ]; then
              echo "::error::${library}: could not read its version or manifest"
              return 1
            fi
            if [ "$manifest_before" = "$manifest_after" ] && git diff --quiet HEAD^1 HEAD -- "$@"; then
              echo "${library}: nothing shipped changed"
            elif [ "$before" != "$after" ] && [ "$(printf '%s\n%s\n' "$before" "$after" | sort -V | tail -n 1)" = "$after" ]; then
              echo "${library}: shipped files changed and the version is raised from ${before} to ${after}"
            else
              echo "::error::${library}: shipped files changed but the version is still ${after}; raise it"
              return 1
            fi
          }
          failed=0
          require_raise markcom "$(python_version HEAD^1)" "$(python_version HEAD)" \
            "$(python_manifest HEAD^1)" "$(python_manifest HEAD)" \
            markcom/src ':(exclude)*_test.py' || failed=1
          require_raise markcom-web-config "$(npm_version HEAD^1 markcom-web-config)" "$(npm_version HEAD markcom-web-config)" \
            "$(npm_manifest HEAD^1 markcom-web-config)" "$(npm_manifest HEAD markcom-web-config)" \
            markcom-web-config/src markcom-web-config/tsconfig.json markcom-web-config/prettier.json || failed=1
          # i18n's tsconfig.json extends web-config's, so a change there changes i18n's build too.
          require_raise markcom-i18n "$(npm_version HEAD^1 markcom-i18n)" "$(npm_version HEAD markcom-i18n)" \
            "$(npm_manifest HEAD^1 markcom-i18n)" "$(npm_manifest HEAD markcom-i18n)" \
            markcom-i18n/src ':(exclude)*.test.ts' markcom-i18n/tsconfig.json markcom-web-config/tsconfig.json || failed=1
          exit "$failed"

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: read
