name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # markcom, the Python start-up library.
  markcom:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: markcom
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Qt's system libraries (the tray tests draw off screen)
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Install dependencies (including dev and test)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Strict type check
        run: uv run mypy src
      - name: Language security scanner
        run: uv run bandit -q -r src -x '*_test.py'
      - name: Dependency audit
        run: uv run pip-audit --skip-editable
      - name: Tests with coverage gate
        run: uv run pytest -q

  # On every push to main (a merged PR included), tags markcom's version from its
  # pyproject.toml as markcom-v<version>, the tag projects install it by and Renovate watches,
  # unless that tag already exists. So raising the version is the whole release.
  release-markcom:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: markcom
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tag the version if it is new
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("markcom/pyproject.toml", "rb"))["project"]["version"])')
          tag="markcom-v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "${tag} already exists; nothing to release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "markcom ${version}"
          git push origin "$tag"
          echo "Released ${tag}"

  # The TypeScript libraries the react-ui websites install from npm. web-config is built
  # first because markcom-i18n lints itself with it.
  web-libraries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        library: [markcom-web-config, markcom-i18n]
    defaults:
      run:
        working-directory: ${{ matrix.library }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: "*/package-lock.json"
      - name: Build markcom-web-config, which markcom-i18n lints with
        if: matrix.library == 'markcom-i18n'
        working-directory: markcom-web-config
        run: npm ci && npm run build
      - name: Install dependencies (including dev and test)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Strict type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm run audit
      # web-config has no unit tests: linting markcom-i18n and the react-ui template with it
      # is its test.
      - name: Tests with coverage gate
        if: matrix.library == 'markcom-i18n'
        run: npm test
      - name: Install Chromium for the end-to-end tests
        if: matrix.library == 'markcom-i18n'
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (language routing on the test site in e2e/site)
        if: matrix.library == 'markcom-i18n'
        run: npm run test:e2e

  # On every push to main (a merged PR included), publishes each web library that changed.
  # A version raised by hand in package.json (a minor or major release) is published as it is;
  # otherwise, when the built package differs from the latest on npm, the next patch version
  # is published. Nothing is committed back. It signs in to npm by trusted publishing, set up
  # on each package's npm settings page for this repository and ci.yml.
  publish-web-libraries:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web-libraries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      # One library failing to publish must not stop the other.
      fail-fast: false
      matrix:
        library: [markcom-web-config, markcom-i18n]
    defaults:
      run:
        working-directory: ${{ matrix.library }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      # markcom-i18n's tsconfig extends markcom-web-config's, which needs its own dependencies.
      - name: Install markcom-web-config's dependencies
        if: matrix.library == 'markcom-i18n'
        working-directory: markcom-web-config
        run: npm ci
      - name: Build
        run: npm ci && npm run build
      - name: Choose the version to publish
        id: release
        run: |
          name=$(node -p "require('./package.json').name")
          declared=$(node -p "require('./package.json').version")
          latest=$(npm view "$name" version)
          # Prints true when the first version is higher than the second.
          is_higher='const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number));
            const i = a.findIndex((part, n) => part !== b[n]);
            console.log(i !== -1 && a[i] > b[i]);'
          if [ "$(node -e "$is_higher" "$declared" "$latest")" = "true" ]; then
            echo "Publishing ${name} ${declared}, raised by hand from ${latest}"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm version "$latest" --no-git-tag-version --allow-same-version > /dev/null
          built=$(npm pack --dry-run --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].shasum')
          if [ "$built" = "$(npm view "${name}@${latest}" dist.shasum)" ]; then
            echo "${name} is unchanged since ${latest}; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm version patch --no-git-tag-version > /dev/null
          echo "Publishing ${name} $(node -p "require('./package.json').version"), changed since ${latest}"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.release.outputs.publish == 'true'
        # npm trusted publishing: npm signs in with this run's OIDC token (id-token: write),
        # so no npm token is stored anywhere.
        run: npm publish --access public --provenance

  secrets:
    runs-on: ubuntu-latest
    # gitleaks lists a pull request's commits, which the default token may not do.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Semgrep
        run: semgrep scan --config p/default --config p/secrets --config p/owasp-top-ten --error
