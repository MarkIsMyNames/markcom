name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markcom:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: markcom
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install Qt's system libraries (the tray tests draw off screen)
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Install dependencies (including dev and test)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Strict type check
        run: uv run mypy src
      - name: Language security scanner
        run: uv run bandit -q -r src -x '*_test.py'
      - name: Dependency audit
        run: uv run pip-audit --skip-editable
      - name: Tests with coverage gate
        run: uv run pytest -q

  # own job, so unit tests stay fast
  markcom-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: markcom
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install dbus-run-session and Qt's system libraries
        run: sudo apt-get update && sudo apt-get install --yes dbus-daemon libegl1
      - name: Install dependencies (including dev and test)
        run: uv sync --locked
      # private session bus, so fake service can own org.freedesktop.Notifications
      - name: Integration tests
        run: dbus-run-session -- uv run pytest tests/integration --no-cov -q

  # tests clone this repo, so need every commit and tag
  release-tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: release-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install dependencies (including dev and test)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Strict type check
        run: uv run mypy src
      - name: Language security scanner
        run: uv run bandit -q -r src -c pyproject.toml
      - name: Dependency audit
        run: uv run pip-audit --skip-editable
      - name: Tests with coverage gate
        run: uv run pytest -q

  versions-unchanged:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/versions-unchanged.yml
    permissions:
      contents: read

  # web-config built first: markcom-i18n lints itself with it
  web-libraries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        library: [markcom-web-config, markcom-i18n]
    defaults:
      run:
        working-directory: ${{ matrix.library }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: "*/package-lock.json"
      - name: Build markcom-web-config, which markcom-i18n lints with
        if: matrix.library == 'markcom-i18n'
        working-directory: markcom-web-config
        run: npm ci && npm run build
      - name: Install dependencies (including dev and test)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Strict type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm run audit
      # web-config has no unit tests: linting markcom-i18n and react-ui template with it is its test
      - name: Tests with coverage gate
        if: matrix.library == 'markcom-i18n'
        run: npm test
      - name: Install Chromium for the end-to-end tests
        if: matrix.library == 'markcom-i18n'
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (language routing on the test site in e2e/site)
        if: matrix.library == 'markcom-i18n'
        run: npm run test:e2e

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [markcom, markcom-integration, web-libraries, release-tools]
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      pull-requests: read

  # publishes any latest tag npm lacks, so next run retries a failed publish
  publish-web-libraries:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      # one library failing to publish must not stop the other
      fail-fast: false
      matrix:
        library: [markcom-web-config, markcom-i18n]
    defaults:
      run:
        working-directory: ${{ matrix.library }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # all tags: find library's latest release
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - name: Check out the latest release, unless it is already on npm
        id: release
        working-directory: .
        env:
          LIBRARY: ${{ matrix.library }}
        run: |
          tag=$(git tag --list "${LIBRARY}-v*" --sort=-version:refname | head -n 1)
          if [ -z "$tag" ]; then
            echo "${LIBRARY} has no release yet; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout --quiet "$tag"
          version=${tag#"${LIBRARY}-v"}
          name=$(node -p "require('./${LIBRARY}/package.json').name")
          declared=$(node -p "require('./${LIBRARY}/package.json').version")
          if [ "$declared" != "$version" ]; then
            echo "::error::${tag}'s package.json says ${declared}; refusing to publish"
            exit 1
          fi
          # npm view exits non-zero for a version it doesn't have
          if [ "$(npm view "${name}@${version}" version 2> /dev/null || true)" = "$version" ]; then
            echo "${name} ${version} is already on npm; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Publishing ${name} ${version}"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      # markcom-i18n's tsconfig extends web-config's, which needs its own dependencies
      - name: Install markcom-web-config's dependencies
        if: steps.release.outputs.publish == 'true' && matrix.library == 'markcom-i18n'
        working-directory: markcom-web-config
        run: npm ci
      - name: Build
        if: steps.release.outputs.publish == 'true'
        run: npm ci && npm run build
      - name: Publish
        if: steps.release.outputs.publish == 'true'
        # trusted publishing: npm signs in with run's OIDC token, so no npm token stored
        run: npm publish --access public --provenance

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: read
