# The release workflow writes every version, so a branch must leave versions alone.
name: Versions unchanged

on:
  workflow_call:

jobs:
  versions-unchanged:
    # Only a branch off main has versions to compare with main's.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Every commit, to find where the branch left main.
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # through toJSON: actionlint 1.7.12 lacks job.workflow_*, which give this workflow's own commit
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .release-tools
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Fail on a changed version
        run: uv run --locked --project .release-tools/release-tools versions-unchanged
