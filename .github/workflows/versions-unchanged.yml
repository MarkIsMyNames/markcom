# Fails a pull request that changes the version of a library its repository's release.json
# lists: the release workflow writes every version. A repository calls it on pull requests, and on
# runs started by hand on a pull request branch, as the visual-baselines workflow starts CI on its
# baseline commit (there it compares with where the branch left the default branch):
#
#   versions-unchanged:
#     if: github.event_name != 'push'
#     uses: MarkIsMyNames/markcom/.github/workflows/versions-unchanged.yml@<commit sha> # release-tools-v<version>
#     permissions:
#       contents: read
name: Versions unchanged

on:
  workflow_call:

jobs:
  versions-unchanged:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # On a pull request, its merge commit and that commit's first parent, main as it is now.
          # Started by hand, every commit, to find where the branch left the default branch.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tools
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Fail on a changed version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: uv run --locked --project .release-tools/release-tools versions-unchanged
