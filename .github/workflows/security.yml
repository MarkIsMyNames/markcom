# Secret and code scanning shared by every repository. Call it from a CI workflow:
#   security:
#     uses: MarkIsMyNames/markcom/.github/workflows/security.yml@<commit sha> # main
#     permissions:
#       contents: read
#       pull-requests: read
name: Security

on:
  workflow_call:

jobs:
  secrets:
    runs-on: ubuntu-latest
    # gitleaks lists a pull request's commits, which the default token may not do.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep
        run: semgrep scan --config p/default --config p/secrets --config p/owasp-top-ten --error
