# Shared, so every react-ui website runs the same accessibility and visual checks.
name: UI tests

on:
  workflow_call:
    inputs:
      node-version:
        description: The Node.js version the project's UI tests run on.
        type: string
        required: true

jobs:
  ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - name: Accessibility (axe on every story)
        run: npm run test:a11y
      - name: Visual regression (every story against visual/__snapshots__)
        run: npm run test:visual
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 14
