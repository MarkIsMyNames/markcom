# Updates a pull request branch's visual baselines, Playwright's screenshots of every Storybook story, and commits
# the ones that changed, using release-tools from the same markcom commit as this workflow. Each run compares with
# the default branch's baselines, not an earlier run's, and rewrites only the screenshots that differ from them.
# The run summary gives the commit and the images it changed, or "No changes". The project's package.json needs
# build-storybook and test:visual:update scripts. A project calls it from a workflow run by hand
# (gh workflow run visual-baselines.yml --ref <branch>), pinned like the security workflow:
#
#   on: workflow_dispatch
#   permissions:
#     contents: read
#   jobs:
#     update:
#       uses: MarkIsMyNames/markcom/.github/workflows/visual-baselines.yml@<commit sha> # main
#       with:
#         app-client-id: ${{ vars.CI_PUSH_APP_CLIENT_ID }}
#         node-version: "26"
#       secrets:
#         app-private-key: ${{ secrets.CI_PUSH_APP_PRIVATE_KEY }}
#
# A push made with GITHUB_TOKEN starts no workflows, so the project's checks would never run on the baseline
# commit. The push uses a GitHub App's token instead: an app with Contents read and write, installed on the
# repository, whose client ID and a private key the caller passes in.
name: Visual baselines

on:
  workflow_call:
    inputs:
      app-client-id:
        description: The client ID of the GitHub App that pushes the baselines.
        type: string
        required: true
      node-version:
        description: The Node.js version the project's UI tests run on.
        type: string
        required: true
      snapshots:
        description: The folder Playwright keeps the baselines in.
        type: string
        default: visual/__snapshots__
    secrets:
      app-private-key:
        description: A private key of that GitHub App.
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    # Runs on one branch take turns, so they never race to push; a third waiting run replaces the second.
    concurrency:
      group: visual-baselines-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Refuse the default branch
        if: github.ref_type != 'branch' || github.ref_name == 'main' || github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::Run this on a pull request branch, not ${GITHUB_REF_NAME}"
          exit 1
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The branch's newest commit, not the one it had when this run was queued.
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}
      # release-tools from the markcom commit this workflow came from; left untracked, so the
      # baseline commit never includes it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tools
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - name: Start from the default branch's baselines
        env:
          SNAPSHOTS_DIR: ${{ inputs.snapshots }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: uv run --locked --project .release-tools/release-tools visual-baselines-restore
      - name: Update the screenshots that differ
        run: npm run test:visual:update
      - name: Commit the changed baselines
        env:
          SNAPSHOTS_DIR: ${{ inputs.snapshots }}
        run: uv run --locked --project .release-tools/release-tools visual-baselines-commit
