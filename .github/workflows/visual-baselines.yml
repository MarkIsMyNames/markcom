# Commits a pull request branch's changed visual baselines (Playwright screenshots of Storybook stories), compared
# with the default branch's. The run summary lists the commit and images, or "No changes". The project needs
# build-storybook and test:visual:update scripts. Started by hand (gh workflow run visual-baselines.yml --ref
# <branch>) from:
#
#   on: workflow_dispatch
#   permissions:
#     contents: write
#     actions: write
#   jobs:
#     update:
#       concurrency:
#         group: visual-baselines-${{ github.ref }}
#         cancel-in-progress: false
#       uses: MarkIsMyNames/markcom/.github/workflows/visual-baselines.yml@<commit sha> # release-tools-v<version>
#       with:
#         node-version: "26"
#         workflows: ci.yml ui-tests.yml
#
# A GITHUB_TOKEN push starts no workflows, so it starts `workflows` (each with a workflow_dispatch trigger) itself.
name: Visual baselines

on:
  workflow_call:
    inputs:
      node-version:
        description: The Node.js version the project's UI tests run on.
        type: string
        required: true
      workflows:
        description: The workflow files to start on the baseline commit, space-separated.
        type: string
        required: true

env:
  SNAPSHOTS_DIR: visual/__snapshots__

jobs:
  # read-only token: runs the project's npm dependencies
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Refuse the default branch
        if: github.ref_type != 'branch' || github.ref_name == 'main' || github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::Run this on a pull request branch, not ${GITHUB_REF_NAME}"
          exit 1
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # branch's newest commit, not the queued one
          ref: ${{ github.ref_name }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tools
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - name: Start from the default branch's baselines
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: uv run --locked --project .release-tools/release-tools visual-baselines-restore
      - run: npm run test:visual:update
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: ${{ env.SNAPSHOTS_DIR }}
          if-no-files-found: error
          retention-days: 1

  # can push and start workflows: runs none of the project's code
  commit:
    needs: screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.screenshots.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: visual-baselines
          path: ${{ env.SNAPSHOTS_DIR }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tools
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - id: commit
        run: uv run --locked --project .release-tools/release-tools visual-baselines-commit
      - name: Start the checks on the baseline commit
        if: steps.commit.outputs.commit != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOWS: ${{ inputs.workflows }}
        run: |
          for workflow in $WORKFLOWS; do
            gh workflow run "$workflow" --ref "$GITHUB_REF_NAME"
            echo "Started $workflow" | tee -a "$GITHUB_STEP_SUMMARY"
          done
