# A push with GITHUB_TOKEN starts no workflows, so this starts `workflows` itself.
name: Visual baselines

on:
  workflow_call:
    inputs:
      node-version:
        description: The Node.js version the project's UI tests run on.
        type: string
        required: true
      workflows:
        description: The workflow files to start on the baseline commit, space-separated.
        type: string
        required: true

env:
  SNAPSHOTS_DIR: visual/__snapshots__

jobs:
  # The project's npm dependencies run here, with a read-only token.
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Refuse the default branch
        if: github.ref_type != 'branch' || github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::Run this on a pull request branch, not ${GITHUB_REF_NAME}"
          exit 1
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The branch's newest commit, not the one it had when the run was queued.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - name: Start from main's baselines
        run: |
          git fetch --depth=1 origin main
          # Only baselines both have, so one the branch deleted or renamed stays gone.
          git diff-tree -r -z --name-only --diff-filter=M HEAD FETCH_HEAD -- "$SNAPSHOTS_DIR" |
            xargs -0 -r git checkout FETCH_HEAD --
      - run: npm run test:visual:update
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: ${{ env.SNAPSHOTS_DIR }}
          if-no-files-found: error
          retention-days: 1

  # This job can push and start workflows, so it runs none of the project's code.
  commit:
    needs: screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.screenshots.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: visual-baselines
          path: ${{ env.SNAPSHOTS_DIR }}
      - name: Commit the changed baselines
        id: commit
        run: |
          git add -A -- "$SNAPSHOTS_DIR"
          if git diff --staged --quiet; then
            echo "No changes" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          changed=$(git diff --staged --name-only | sed 's/^/- /')
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "test(visual): update baselines"
          # Fails if the branch has moved since the screenshots' commit.
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'Commit: %s\n\nChanged images:\n%s\n' "$(git rev-parse HEAD)" "$changed" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Start the checks on the baseline commit
        if: steps.commit.outputs.commit != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOWS: ${{ inputs.workflows }}
        run: |
          for workflow in $WORKFLOWS; do
            gh workflow run "$workflow" --ref "$GITHUB_REF_NAME"
            echo "Started $workflow" | tee -a "$GITHUB_STEP_SUMMARY"
          done
