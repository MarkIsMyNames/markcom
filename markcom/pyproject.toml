[project]
name = "markcom"
version = "0.3.0"
description = "Shared code for Python projects: typed config, .env secrets, logging, the entry-point runner and, with the desktop extra, notifications and a tray icon."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14",
    "pydantic-settings>=2.12",
]

[project.optional-dependencies]
# Desktop apps only: notifications (markcom.notifier) and the tray icon (markcom.tray).
desktop = [
    "desktop-notifier>=6.2",
    "pyside6-essentials>=6.12",
    "python-slugify>=9.2.0",
    "sdbus>=0.14.3",
    "sdbus-notifications>=1.0.3",
    "xdg-base-dirs>=6.1.0",
]
# Shows an app's local web page in its own window (markcom.window).
window = [
    "markcom[desktop]",
    "pyside6-webengine>=6.12",
]

[dependency-groups]
dev = [
    "markcom[window]",
    "bandit>=1.9",
    "mypy>=2.4",
    "pip-audit>=2.10",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.17",
    "dbus-fast>=5.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/markcom"]
exclude = ["**/*_test.py"]

# ---------- Tests: next to the code, named *_test.py ----------
[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_test.py"]
addopts = "--strict-markers --strict-config --cov=markcom --cov-report=term-missing --cov-fail-under=85"
filterwarnings = [
    "error",
    # desktop-notifier 6.2.0 (the latest) calls an asyncio API Python 3.14 deprecates; not our code.
    "ignore:'asyncio.DefaultEventLoopPolicy' is deprecated:DeprecationWarning:desktop_notifier.main",
]

[tool.coverage.run]
omit = ["*_test.py"]

# ---------- Lint: every rule on ----------
[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",      # house rule: comments only where needed, so no docstring on every item
    "COM812", # conflicts with the formatter (ruff docs)
    "CPY001", # no copyright header in each file
]

[tool.ruff.lint.per-file-ignores]
"*_test.py" = [
    "S101",    # assert is how pytest checks
    "ANN",     # tests are exempt from annotations
    "PLR2004", # tests are black box and use plain literals
    "INP001",  # test files sit beside the code, not in a package of their own
]

[tool.ruff.format]
quote-style = "double"

# ---------- Types: strictest, tests excluded ----------
[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["markcom"]
exclude = ['_test\.py$']
warn_unreachable = true
enable_error_code = ["deprecated", "exhaustive-match", "explicit-override", "ignore-without-code", "mutable-override", "possibly-undefined", "redundant-expr", "redundant-self", "truthy-bool", "truthy-iterable", "unimported-reveal", "unused-awaitable"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------- Security scanner ----------
[tool.bandit]
# Test files only: assert and fake credentials are how tests work (code-testing allows this group exclusion).
exclude_dirs = ["*_test.py"]
