[project]
name = "markcom"
version = "0.5.0"
description = "Shared code for Python projects: typed config, .env secrets, logging and the entry-point runner; with the desktop extra, notifications; with the window extra, a tray icon and a web frontend in its own window; with the web extra, a loopback Host/Origin guard; with the nicegui extra, a NiceGUI UI served on its own thread."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14",
    "pydantic-settings>=2.12",
]

[project.optional-dependencies]
# no Qt, so notification-only apps stay small
desktop = [
    "dbus-fast>=5.2",
]
# every tray app has a window
window = [
    "markcom[desktop]",
    "pyside6-webengine>=6.12",
]
# no NiceGUI, so any ASGI app can use the guard
web = [
    "starlette>=1.3",
]
nicegui = [
    "markcom[web]",
    "nicegui>=4.0",
    "uvicorn>=0.54",
    "wsproto>=1.3",
]

[dependency-groups]
dev = [
    "markcom[window,nicegui]",
    "bandit>=1.9",
    "httpx>=0.28",
    "mypy>=2.4",
    "pip-audit>=2.10",
    "psutil>=7.2",
    "pytest>=9.0",
    "pytest-asyncio>=1.5",
    "pytest-cov>=7.0",
    "pytest-qt>=4.5",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/markcom"]
exclude = ["**/*_test.py"]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_test.py"]
addopts = "--strict-markers --strict-config --cov=markcom --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "auto"
qt_api = "pyside6"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
omit = ["*_test.py"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",      # house rule: comments only where needed, so no docstring on every item
    "COM812", # conflicts with the formatter (ruff docs)
    "CPY001", # no copyright header in each file
    "TC001",  # house rule: imports only at the top, never under `if TYPE_CHECKING:`
    "TC002",  # house rule: imports only at the top, never under `if TYPE_CHECKING:`
    "TC003",  # house rule: imports only at the top, never under `if TYPE_CHECKING:`
]

[tool.ruff.lint.per-file-ignores]
"*_test.py" = [
    "S101",    # assert is how pytest checks
    "ANN",     # tests are exempt from annotations
    "PLR2004", # tests are black box and use plain literals
    "INP001",  # test files sit beside the code, not in a package of their own
]
# only module that starts processes: list args, no shell, yet every launch is flagged
"src/markcom/commands.py" = ["S603"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["markcom"]
exclude = ['_test\.py$']
warn_unreachable = true
enable_error_code = ["deprecated", "exhaustive-match", "explicit-override", "ignore-without-code", "mutable-override", "possibly-undefined", "redundant-expr", "redundant-self", "truthy-bool", "truthy-iterable", "unimported-reveal", "unused-awaitable"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.bandit]
# tests: assert and fake credentials are how tests work; commands.py: ruff's S rules check it
exclude_dirs = ["*_test.py", "*/commands.py"]
