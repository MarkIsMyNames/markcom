# Replace every <PLACEHOLDER> with the project's command for that check (see ci-pipeline SKILL.md).
# After copying: pre-commit install && pre-commit autoupdate && pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml                           # YAML files that fail to parse
      - id: check-json                           # JSON files that fail to parse
      - id: check-toml                           # TOML files that fail to parse
      - id: end-of-file-fixer                    # files not ending in exactly one newline (fixes them)
      - id: trailing-whitespace                  # spaces or tabs at the end of lines (fixes them)
      - id: mixed-line-ending                    # CRLF and LF mixed in one file (converts to LF)
        args: [--fix=lf]
      - id: fix-byte-order-marker                # UTF-8 byte order marks at the start of files (removes them)
      - id: check-merge-conflict                 # leftover <<<<<<< / >>>>>>> conflict markers
      - id: check-case-conflict                  # names that clash on case-insensitive file systems (macOS, Windows)
      - id: check-illegal-windows-names          # file names Windows cannot create (CON, PRN, trailing dots)
      - id: check-symlinks                       # symlinks that point to nothing
      - id: destroyed-symlinks                   # symlinks accidentally replaced by a plain file
      - id: check-shebang-scripts-are-executable # scripts with a #! line but no executable bit

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks                             # secrets: API keys, tokens, passwords, private keys

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint                           # GitHub Actions workflows: syntax, expressions, unknown inputs

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck                           # shell scripts: quoting bugs, unsafe patterns, portability

  - repo: local
    hooks:
      - id: block-env-files
        name: Block .env files from commits
        entry: .env files hold secrets and must never be committed
        language: fail
        files: (^|/)\.env(\..+)?$
        exclude: (^|/)\.env\.example$

      - id: semgrep
        name: Semgrep
        entry: semgrep scan --config p/default --config p/secrets --config p/owasp-top-ten --error --quiet
        language: system
        pass_filenames: false

      - id: uv-lock-check
        name: uv.lock matches pyproject.toml
        # CI's uv sync --locked fails on a stale lock; this catches it before the commit.
        entry: bash -c 'uv lock --check --quiet --directory markcom && uv lock --check --quiet --directory release-tools'
        language: system
        files: (^|/)(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: markcom-lint
        name: "markcom: Lint"
        entry: bash -c 'cd markcom && uv run ruff check .'
        language: system
        pass_filenames: false
        always_run: true

      - id: markcom-format
        name: "markcom: Format check"
        entry: bash -c 'cd markcom && uv run ruff format --check .'
        language: system
        pass_filenames: false
        always_run: true

      - id: markcom-types
        name: "markcom: Strict type check"
        entry: bash -c 'cd markcom && uv run mypy src'
        language: system
        pass_filenames: false
        always_run: true

      # commands.py: only process launcher, takes list args never a shell; bandit cannot skip per file, so own run
      - id: markcom-language-scanner
        name: "markcom: Language security scanner"
        entry: bash -c 'cd markcom && uv run bandit -q -r src -x '\''*_test.py,src/markcom/commands.py'\'' && uv run bandit -q src/markcom/commands.py -s B404,B603'
        language: system
        pass_filenames: false
        always_run: true

      - id: markcom-audit
        name: "markcom: Dependency audit"
        entry: bash -c 'cd markcom && uv run pip-audit --skip-editable'
        language: system
        pass_filenames: false
        always_run: true

      - id: markcom-unit-tests
        name: "markcom: Unit tests with coverage gate"
        entry: bash -c 'cd markcom && uv run pytest -q -p no:cacheprovider'
        language: system
        pass_filenames: false
        always_run: true

      - id: release-tools-lint
        name: "release-tools: Lint"
        entry: bash -c 'cd release-tools && uv run ruff check .'
        language: system
        pass_filenames: false
        always_run: true

      - id: release-tools-format
        name: "release-tools: Format check"
        entry: bash -c 'cd release-tools && uv run ruff format --check .'
        language: system
        pass_filenames: false
        always_run: true

      - id: release-tools-types
        name: "release-tools: Strict type check"
        entry: bash -c 'cd release-tools && uv run mypy src'
        language: system
        pass_filenames: false
        always_run: true

      - id: release-tools-language-scanner
        name: "release-tools: Language security scanner"
        entry: bash -c 'cd release-tools && uv run bandit -q -r src -c pyproject.toml'
        language: system
        pass_filenames: false
        always_run: true

      - id: release-tools-audit
        name: "release-tools: Dependency audit"
        entry: bash -c 'cd release-tools && uv run pip-audit --skip-editable'
        language: system
        pass_filenames: false
        always_run: true

      - id: release-tools-unit-tests
        name: "release-tools: Unit tests with coverage gate"
        entry: bash -c 'cd release-tools && uv run pytest -q -p no:cacheprovider'
        language: system
        pass_filenames: false
        always_run: true

      - id: markcom-web-config-lint
        name: "markcom-web-config: Lint"
        entry: bash -c 'cd markcom-web-config && npm run lint'
        language: system
        pass_filenames: false
        files: ^markcom-(web-config|i18n)/

      - id: markcom-web-config-format
        name: "markcom-web-config: Format check"
        entry: bash -c 'cd markcom-web-config && npm run format:check'
        language: system
        pass_filenames: false
        files: ^markcom-(web-config|i18n)/

      - id: markcom-web-config-types
        name: "markcom-web-config: Strict type check"
        entry: bash -c 'cd markcom-web-config && npm run typecheck'
        language: system
        pass_filenames: false
        files: ^markcom-(web-config|i18n)/

      - id: markcom-web-config-audit
        name: "markcom-web-config: Dependency audit"
        entry: bash -c 'cd markcom-web-config && npm run audit'
        language: system
        pass_filenames: false
        files: ^markcom-(web-config|i18n)/

      - id: markcom-i18n-lint
        name: "markcom-i18n: Lint"
        entry: bash -c 'cd markcom-i18n && npm run lint'
        language: system
        pass_filenames: false
        files: ^markcom-(web-config|i18n)/

      - id: markcom-i18n-format
        name: "markcom-i18n: Format check"
        entry: bash -c 'cd markcom-i18n && npm run format:check'
        language: system
        pass_filenames: false
        files: ^markcom-(web-config|i18n)/

      - id: markcom-i18n-types
        name: "markcom-i18n: Strict type check"
        entry: bash -c 'cd markcom-i18n && npm run typecheck'
        language: system
        pass_filenames: false
        files: ^markcom-(web-config|i18n)/

      - id: markcom-i18n-audit
        name: "markcom-i18n: Dependency audit"
        entry: bash -c 'cd markcom-i18n && npm run audit'
        language: system
        pass_filenames: false
        files: ^markcom-(web-config|i18n)/

      - id: markcom-i18n-unit-tests
        name: "markcom-i18n: Unit tests with coverage gate"
        entry: bash -c 'cd markcom-i18n && npm test'
        language: system
        pass_filenames: false
        files: ^markcom-(web-config|i18n)/
